server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.130.113.104 _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://8.130.113.104$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 8.130.113.104 _;

    ssl_certificate /etc/letsencrypt/live/8.130.113.104/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.130.113.104/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ToolboxTLS:10m;
    ssl_session_tickets off;
    client_max_body_size 320m;

    access_log /var/log/nginx/toolbox_access.log toolbox_timing;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location /updates/ {
        alias /opt/amazon-toolbox/backend/updates/;
        try_files $uri =404;
    }

    location ~ ^/api/updates/(upload|releases/stage)$ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
    }
}
