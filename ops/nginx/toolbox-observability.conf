# Included from nginx.conf's http context via /etc/nginx/conf.d/*.conf.
log_format toolbox_timing
  '$remote_addr - $request_id [$time_local] "$request" '
  '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time '
  'rid=$upstream_http_x_request_id ua="$http_user_agent"';

proxy_headers_hash_max_size 1024;
proxy_headers_hash_bucket_size 128;
