[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = backend
testpaths = backend/tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore:Can't sort tables for DROP:sqlalchemy.exc.SAWarning
