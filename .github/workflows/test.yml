name: Continuous verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend and Electron contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run deadcode
      - run: npm test
      - name: Build web bundle
        run: npm run build:web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  backend:
    name: Backend domains and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend --rootdir=backend -q
      - name: Ruff migrated domains
        run: >-
          python -m ruff check
          backend/domains/auth backend/domains/knowledge backend/domains/catalog
          backend/core/deprecation.py backend/app/lifecycle.py
          backend/routers/auth.py backend/routers/ai_chat.py backend/routers/knowledge.py
          backend/routers/help.py backend/routers/tools.py
          backend/routers/announcements.py backend/routers/updates.py
      - name: Mypy migrated domains
        run: python -m mypy --config-file backend/pyproject.toml backend/app backend/domains

  mariadb-concurrency:
    name: MariaDB order state concurrency
    runs-on: ubuntu-latest
    needs: backend
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root-test-only
          MARIADB_DATABASE: toolbox_test
          MARIADB_USER: toolbox_test
          MARIADB_PASSWORD: toolbox-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MARIADB_TEST_URL: mysql+aiomysql://toolbox_test:toolbox-test-only@127.0.0.1:3306/toolbox_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify manual order state idempotency on MariaDB
        run: >-
          python -m pytest
          backend/tests/integration/test_mariadb_order_concurrency.py
          --rootdir=backend -q -rs

  responsive-e2e:
    name: Responsive C B Admin smoke
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.business.config.ts
        env:
          PLAYWRIGHT_PREBUILT: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: responsive-e2e-failure
          path: test-results/business-responsive/
          if-no-files-found: ignore
          retention-days: 7

  internal-acceptance-e2e:
    name: Internal critical-flow acceptance
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.internal.config.ts
        env:
          PLAYWRIGHT_PREBUILT: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: internal-acceptance-artifacts
          path: test-results/internal-acceptance/
          if-no-files-found: ignore
          retention-days: 7

  desktop-package:
    name: Windows desktop package
    runs-on: windows-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm run backend:build
      - run: npm run electron:compile
      - run: npm run build:desktop
      - run: npx electron-builder --win --dir
      - run: npm run package:audit
      - uses: actions/upload-artifact@v7
        with:
          name: windows-unpacked-smoke
          path: release/win-unpacked/
          retention-days: 3
