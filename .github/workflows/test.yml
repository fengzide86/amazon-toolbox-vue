name: Continuous verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend and Electron contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run deadcode
      - run: npm test
      - name: Build web bundle
        run: npx vite build --mode production

  backend:
    name: Backend domains and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend --rootdir=backend -q
      - name: Ruff migrated domains
        run: >-
          python -m ruff check
          backend/domains/auth backend/domains/knowledge backend/domains/catalog
          backend/core/deprecation.py backend/app/lifecycle.py
          backend/routers/auth.py backend/routers/ai_chat.py backend/routers/knowledge.py
          backend/routers/help.py backend/routers/tools.py
          backend/routers/announcements.py backend/routers/updates.py
      - name: Mypy migrated domains
        run: python -m mypy --config-file backend/pyproject.toml backend/app backend/domains

  responsive-e2e:
    name: Responsive C B Admin smoke
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:business
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  desktop-package:
    name: Windows desktop package
    runs-on: windows-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm run backend:build
      - run: npm run electron:compile
      - run: npm run build:desktop
      - run: npx electron-builder --win --dir
      - run: npm run package:audit
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unpacked-smoke
          path: release/win-unpacked/
          retention-days: 3
