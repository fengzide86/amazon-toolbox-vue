name: Continuous verification

on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend and Electron contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - run: npm run typecheck
      - run: npm run lint -- --max-warnings=0
      - run: npm run architecture:check
      - run: python scripts/generate_openapi_types.py --check
      - run: npm run deadcode
      - run: npm run electron:compile
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build web bundle
        run: npm run build:web
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist/
          retention-days: 1

  backend:
    name: Backend domains and API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: OpenAPI snapshot and generated types
        run: >-
          python scripts/export_openapi.py --output backend/openapi.json --check &&
          python scripts/check_openapi_compat.py &&
          python scripts/generate_openapi_types.py --check
      - run: python -m pytest backend --rootdir=backend --cov=backend --cov-report=term-missing --cov-report=xml:backend/coverage.xml -q
      - name: Python diff coverage
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            DIFF_BASE="origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            DIFF_BASE="$BEFORE_SHA"
          else
            DIFF_BASE="HEAD^"
          fi
          python scripts/check_diff_coverage.py --base "$DIFF_BASE" --threshold 80
      - run: python -m ruff check backend
      - name: Mypy application and modular monolith
        run: python -m mypy --config-file backend/pyproject.toml backend/app backend/core backend/domains backend/services backend/routers
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  mariadb-concurrency:
    name: MariaDB order state concurrency
    runs-on: ubuntu-latest
    needs: backend
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root-test-only
          MARIADB_DATABASE: toolbox_test
          MARIADB_USER: toolbox_test
          MARIADB_PASSWORD: toolbox-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MARIADB_TEST_URL: mysql+aiomysql://toolbox_test:toolbox-test-only@127.0.0.1:3306/toolbox_test
      REQUIRE_MARIADB_TEST: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify manual order state idempotency on MariaDB
        run: >-
          python -m pytest
          backend/tests/integration/test_mariadb_order_concurrency.py
          --rootdir=backend -q -rs

  responsive-e2e:
    name: Responsive C B Admin smoke
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.business.config.ts
        env:
          PLAYWRIGHT_PREBUILT: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: responsive-e2e-failure
          path: test-results/business-responsive/
          if-no-files-found: ignore
          retention-days: 7

  internal-acceptance-e2e:
    name: Internal critical-flow acceptance
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.internal.config.ts
        env:
          PLAYWRIGHT_PREBUILT: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: internal-acceptance-artifacts
          path: test-results/internal-acceptance/
          if-no-files-found: ignore
          retention-days: 7

  desktop-package:
    name: Windows desktop package
    runs-on: windows-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run electron:compile
      - run: npm run build:desktop
      - run: npx electron-builder --win --dir
      - run: npm run package:audit
      - uses: actions/upload-artifact@v7
        with:
          name: windows-unpacked-smoke
          path: release/win-unpacked/
          retention-days: 3
