[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["build", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
strict = false
disallow_untyped_defs = true
check_untyped_defs = true
disallow_any_generics = true
follow_imports = "skip"
warn_unused_configs = true
exclude = ["build", "alembic/versions"]
